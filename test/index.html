<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <title>Frame Viewer</title>
  <style>
    body { font-family: monospace; padding: 20px; }
    img { max-width: 640px; border: 1px solid #ccc; display: block; }
    .stat { margin-top: 10px; }
  </style>
</head>
<body>

<h2>Socket.IO Frame Viewer</h2>

<img id="img" />

<div class="stat">FPS: <span id="fps">0</span></div>
<div class="stat">Avg Latency (ms): <span id="lat">0</span></div>
<div class="stat">Last Frame ID: <span id="fid">-</span></div>

<!-- socket.io 客户端 -->
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script>
  /*********** 配置 ***********/
  const SOCKET_IO_URL = 'http://106.52.171.112:8800'; // ← 改这里
  /***************************/

  const socket = io(SOCKET_IO_URL, {
    transports: ['websocket'] // 强制 WS（可选）
  });

  const imgEl = document.getElementById('img');
  const fpsEl = document.getElementById('fps');
  const latEl = document.getElementById('lat');
  const fidEl = document.getElementById('fid');

  let count = 0;
  let lastSec = performance.now();
  let latencies = [];

  socket.on('connect', () => {
    console.log('connected to socket.io');
  });

  socket.on('frame', (frame) => {
    count++;
    fidEl.textContent = frame.frameId ?? '-';

    // ===== 延迟 =====
    if (frame.ts_src) {
      const now = Date.now();
      latencies.push(now - frame.ts_src);
    }

    // ===== 渲染图片 =====
    if (frame.data) {
      const mime = frame.codec
        ? `image/${frame.codec}`
        : 'image/jpeg';

      const blob = new Blob([frame.data], { type: mime });
      imgEl.src = URL.createObjectURL(blob);
    }

    // ===== FPS 统计 =====
    const nowPerf = performance.now();
    if (nowPerf - lastSec >= 1000) {
      fpsEl.textContent = count;

      if (latencies.length) {
        const avg =
          latencies.reduce((a,b)=>a+b,0) / latencies.length;
        latEl.textContent = avg.toFixed(1);
      }

      count = 0;
      latencies = [];
      lastSec = nowPerf;
    }
  });

  socket.on('disconnect', () => {
    console.log('socket disconnected');
  });
</script>

</body>
</html>
