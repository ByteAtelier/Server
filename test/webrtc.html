<!doctype html>
<html>

<head>
    <meta charset="utf-8" />
    <title>WebRTC Relay Viewer</title>
    <style>
        video {
            width: 480px;
            height: 360px;
            background: #000;
        }

        #wrap {
            position: relative;
            display: inline-block;
        }

        #fps {
            position: absolute;
            top: 8px;
            left: 8px;
            padding: 4px 8px;
            background: rgba(0, 0, 0, 0.6);
            color: #0f0;
            font: 14px monospace;
            border-radius: 4px;
        }
    </style>
</head>

<body>
    <h3>WebRTC (TURN relay)</h3>
    <video id="v" autoplay playsinline muted></video>
    <div id="fps">FPS: --</div>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script>
        const socket = io("http://106.52.171.112:8800", {
            transports: ["websocket"],
            upgrade: false,
        });

        const pc = new RTCPeerConnection({
            iceServers: [{
                urls: [
                    'turn:39.105.171.44:3478?transport=udp',
                    'turn:39.105.171.44:3478?transport=tcp',
                ],
                username: "BS-coturn",
                credential: "DnDzRttdGVB25MntSpAEUDxrxvkwBjP8",
            }],
            iceTransportPolicy: "relay",
        });

        const video = document.getElementById("v");
        const remoteStream = new MediaStream();

        let lastTime = 0;
        let frames = 0;
        const fpsEl = document.getElementById("fps");
        let lastFrameTime = Date.now();
        let frameDelay = 0;

        pc.ontrack = (e) => {
            console.log("[viewer] ontrack", e.track.kind, e.track.readyState, e.streams);
            remoteStream.addTrack(e.track);
            video.srcObject = remoteStream;

            video.onloadedmetadata = () => {
                console.log("[viewer] meta", video.videoWidth, video.videoHeight);
                video.play().catch(console.warn);
            };
        };

        pc.onicecandidate = (e) => {
            if (e.candidate) socket.emit("webrtc:ice", e.candidate);
        };

        socket.on("webrtc:ice", async (c) => {
            try { await pc.addIceCandidate(c); } catch { }
        });

        socket.on("webrtc:answer", async (answer) => {
            await pc.setRemoteDescription(answer);
        });

        setInterval(async () => {
            const stats = await pc.getStats();
            for (const r of stats.values()) {
                if (r.type === "inbound-rtp" && r.kind === "video") {
                    console.log("[stats]",
                        "packets", r.packetsReceived,
                        "bytes", r.bytesReceived,
                        "framesDecoded", r.framesDecoded
                    );
                }
            }
        }, 1000);

        // Frame processing and FPS calculation
        function onVideoFrame(now) {
            const timestamp = Date.now();
            frames++;

            // Calculate delay in rendering the current frame
            if (lastFrameTime !== 0) {
                frameDelay = timestamp - lastFrameTime;
            }

            if (!lastTime) lastTime = now;
            const delta = now - lastTime;
            if (delta >= 1000) {
                const fps = frames * 1000 / delta;
                fpsEl.textContent = `FPS: ${fps.toFixed(1)} | Delay: ${frameDelay}ms`;
                frames = 0;
                lastTime = now;
            }
            lastFrameTime = timestamp;

            video.requestVideoFrameCallback(onVideoFrame);
        }

        video.requestVideoFrameCallback(onVideoFrame);

        (async () => {
            const offer = await pc.createOffer({ offerToReceiveVideo: true, offerToReceiveAudio: false });
            await pc.setLocalDescription(offer);
            socket.emit("webrtc:offer", pc.localDescription);
        })();
    </script>
</body>

</html>
